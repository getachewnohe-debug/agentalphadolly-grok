<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#121A2B"/>
      <stop offset="1" stop-color="#1D1B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="80" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C9CFF"/>
      <stop offset="0.5" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#9B5DE5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- soft abstract geometric accents -->
  <circle cx="1320" cy="100" r="160" fill="#7C9CFF" fill-opacity="0.12"/>
  <circle cx="1270" cy="410" r="210" fill="#4CC9F0" fill-opacity="0.10"/>
  <circle cx="220" cy="120" r="170" fill="#9B5DE5" fill-opacity="0.10"/>

  <!-- code-like blocks -->
  <g opacity="0.9">
    <rect x="118" y="108" width="210" height="10" rx="5" fill="#5EEAD4" fill-opacity="0.8"/>
    <rect x="118" y="136" width="168" height="10" rx="5" fill="#7DD3FC" fill-opacity="0.8"/>
    <rect x="118" y="164" width="240" height="10" rx="5" fill="#C4B5FD" fill-opacity="0.8"/>
    <rect x="118" y="192" width="176" height="10" rx="5" fill="#F9A8D4" fill-opacity="0.8"/>
  </g>

  <g opacity="0.9">
    <rect x="1040" y="88" width="210" height="10" rx="5" fill="#7DD3FC" fill-opacity="0.8"/>
    <rect x="1010" y="118" width="240" height="10" rx="5" fill="#5EEAD4" fill-opacity="0.8"/>
    <rect x="1070" y="148" width="170" height="10" rx="5" fill="#C4B5FD" fill-opacity="0.8"/>
    <rect x="1038" y="178" width="200" height="10" rx="5" fill="#F9A8D4" fill-opacity="0.8"/>
  </g>

  <!-- central glowing panel -->
  <g filter="url(#glow)">
    <rect x="420" y="123" width="660" height="226" rx="30" fill="rgba(13, 18, 32, 0.66)" stroke="url(#accent)" stroke-width="2"/>
  </g>

  <!-- diagonal line accents -->
  <path d="M440 332L1060 332" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M440 332L570 123" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <path d="M1060 332L930 123" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Text -->
  <text x="750" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">Agent Alpha Dolly</text>
  <text x="750" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#A5F3FC" letter-spacing="2">AI-POWERED GITHUB ASSISTANT</text>

  <g>
    <rect x="545" y="292" width="410" height="36" rx="18" fill="#101827" stroke="#7C9CFF" stroke-opacity="0.6"/>
    <text x="750" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">Code review • Issue triage • Automation</text>
  </g>

  <!-- bottom line -->
  <text x="750" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1" opacity="0.9">github.com/getachewnohe-debug/agentalphadolly-grok</text>
</svg>
